name: Build Flet App for Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          python3-xlib \
          scrot \
          xclip
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet pyautogui pynput pyinstaller
    
    - name: Create spec file
      run: |
        cat > KrabbClicker.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'pynput.keyboard._xorg',
                'pynput.mouse._xorg',
                'pynput._util.xorg',
                'Xlib',
                'Xlib.display',
                'Xlib.X',
                'Xlib.XK',
                'Xlib.ext',
                'Xlib.protocol',
                'Xlib.threaded',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            noarchive=False,
        )
        
        pyz = PYZ(a.pure)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.datas,
            [],
            name='KrabbClicker',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        EOF
    
    - name: Build with PyInstaller
      run: |
        pyinstaller KrabbClicker.spec
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KrabbClicker-Linux
        path: dist/KrabbClicker
