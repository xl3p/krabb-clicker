name: Build Flet App for Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          python3-xlib \
          scrot \
          xclip \
          binutils
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet pyautogui pynput pyinstaller
    
    - name: Build with Flet pack
      run: |
        flet pack main.py \
          --name "KrabbClicker" \
          --add-data "assets:assets"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KrabbClicker-Linux
        path: dist/KrabbClickername: Build Flet App for Linux

