name: Build Linux Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flet pyautogui pynput
        sudo apt-get update
        sudo apt-get install -y python3-tk python3-dev scrot
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name "myapp" your_script.py
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: Krabb-clicker_linux_x86_64
        path: dist/myapp
