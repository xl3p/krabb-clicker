name: Build Flet App for Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          python3-xlib \
          scrot \
          xclip
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet pyautogui pynput
        pip install pyinstaller
    
    - name: Build with Flet pack
      run: |
        flet pack main.py \
          --name "KrabbClicker" \
          --onedir
    
    - name: Package
      run: |
        cd dist
        tar -czf KrabbClicker-linux.tar.gz KrabbClicker/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KrabbClicker-Linux
        path: dist/KrabbClicker-linux.tar.gz
